services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: money-manager
      POSTGRES_HOST: db
    volumes:
      - docker-data-postgresql:/var/lib/postgresql/data
  adminer:
    image: adminer
    ports:
      - 8080:8080
  redis:
    image: redis
    container_name: cache
    expose:
      - 6379

volumes:
  docker-data-postgresql:
